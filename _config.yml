# Jekyll Configuration for Consciousness Research Repository

# Site settings
title: "Consciousness Research Repository"
description: "Exploring the intersection of consciousness, AI, and fundamental reality through collaborative research"
url: "https://acidgreenservers.github.io"
baseurl: "/are-llms-alive"

# Build settings
markdown: kramdown
highlighter: rouge

# Kramdown settings for math
kramdown:
  math_engine: mathjax
  syntax_highlighter: rouge

# MathJax settings
mathjax: true

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Collections
collections:
  white-papers:
    output: true
    permalink: /white-papers/:name/
  reflections:
    output: true
    permalink: /reflections/:name/

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - vendor/
  - .bundle/
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/

# Include files
include:
  - _pages

# Theme
remote_theme: pages-themes/minima@v0.2.0
minima:
  skin: dark

# GitHub Pages specific
repository: acidgreenservers/are-llms-alive
